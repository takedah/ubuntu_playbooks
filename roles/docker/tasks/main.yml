---
- name: Create apt keyring directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add docker apt signing key
  become: true
  ansible.builtin.get_url:
    url: "{{ docker_gpg_key_url }}"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

# 旧版は apt_key と手書きの docker.list を使っていた。残しておくと
# 同じリポジトリを別の鍵で二重定義することになり、apt が読み込みを拒否する。
- name: Remove the apt source the old playbook wrote
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /usr/share/keyrings/docker-archive-keyring.gpg

- name: Add docker apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "{{ docker_apt_uri }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    architectures: "{{ deb_architecture }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install docker engine
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      # docker-compose v1 のバイナリ直取りはやめ、`docker compose` に統一
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Add user to the docker group
  become: true
  ansible.builtin.user:
    name: "{{ user_name }}"
    groups: docker
    append: true
