---
- name: Create neovim install directory
  become: true
  ansible.builtin.file:
    path: "{{ neovim_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# 公式のビルド済み tarball を使う。ソースからのビルドはもうしない。
# unarchive は checksum を取れないので、取得と展開を分けて検証を挟む。
- name: Download the official neovim release tarball
  become: true
  ansible.builtin.get_url:
    url: https://github.com/neovim/neovim/releases/download/{{ neovim_version }}/{{ neovim_tarball }}
    dest: /usr/local/src/{{ neovim_tarball }}
    checksum: "{{ neovim_checksum }}"
    owner: root
    group: root
    mode: "0644"

- name: Install neovim from the tarball
  become: true
  ansible.builtin.unarchive:
    src: /usr/local/src/{{ neovim_tarball }}
    dest: "{{ neovim_install_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ neovim_install_dir }}/bin/nvim"
    owner: root
    group: root

- name: Link nvim into PATH
  become: true
  ansible.builtin.file:
    src: "{{ neovim_install_dir }}/bin/nvim"
    dest: /usr/local/bin/nvim
    state: link
    # 旧版の Playbook はここにソースビルドした実体を置いていた。
    # force なしだと file モジュールが実体からリンクへの変換を拒否する。
    force: true

- name: Create vim-plug autoload directory
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/share/nvim/site/autoload"
    state: directory
    mode: "0755"

- name: Install vim-plug
  ansible.builtin.get_url:
    url: "{{ vim_plug_url }}"
    dest: "{{ ansible_facts.env.HOME }}/.local/share/nvim/site/autoload/plug.vim"
    checksum: "{{ vim_plug_checksum }}"
    mode: "0644"

# coc-settings.json の jedi.executable.command と diagnostic-languageserver の
# formatters、および ale の black fixer が PATH 上に要求する。
# uv tool install は ~/.local/bin に置くので .profile の PATH でそのまま通る。
- name: Install python language server and formatters
  ansible.builtin.command: mise exec -- uv tool install --quiet {{ item }}
  args:
    creates: "{{ ansible_facts.env.HOME }}/.local/share/uv/tools/{{ item }}"
  loop: "{{ python_cli_tools }}"

- name: Install neovim plugins
  ansible.builtin.command: mise exec -- nvim --headless "+PlugInstall --sync" +qa
  args:
    creates: "{{ ansible_facts.env.HOME }}/.local/share/nvim/plugged"
