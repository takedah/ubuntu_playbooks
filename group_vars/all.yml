---
# docker グループに追加するユーザ。接続ユーザをそのまま使う。
# 固定値にすると、ローカル実行や WSL2 でユーザ名が違ったときに
# user モジュールがその名前で新規ユーザを作ってしまう。
user_name: "{{ ansible_facts.user_id }}"

dotfiles_repo: https://github.com/takedah/dotfiles.git
dotfiles_dir: "{{ ansible_facts.env.HOME }}/dotfiles"
dotfiles_version: main

# mise (https://mise.jdx.dev/installing-mise.html)
mise_gpg_key_url: https://mise.jdx.dev/gpg-key.pub
mise_apt_uri: https://mise.jdx.dev/deb

python_version: "3.14.7"
node_version: "24"

# nvim の python3 / node provider 用。mise がバージョン変更時にも入れ直してくれる
mise_default_python_packages:
  - pynvim
mise_default_npm_packages:
  - neovim
  - yarn
  - diagnostic-languageserver

# coc-settings.json と ale が PATH 上に要求するツール群
python_cli_tools:
  - jedi-language-server
  - black
  - isort
  - flake8

# apt と GitHub リリースでアーキテクチャの表記が違うので両方持つ
deb_architecture: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"
nvim_architecture: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'x86_64' }}"

neovim_version: v0.12.5
neovim_tarball: nvim-linux-{{ nvim_architecture }}.tar.gz
neovim_install_dir: /opt/nvim-{{ neovim_version }}
# neovim はチェックサムを配布していないので自前で固定する。
# neovim_version を上げたら必ずここも更新すること:
#   curl -sfL <tarball url> | shasum -a 256
neovim_checksums:
  x86_64: sha256:bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875
  arm64: sha256:1aa5ca085249580ae0f91eb14f27ec0919773ff2d99a163d03f3d6c21ac29725
neovim_checksum: "{{ neovim_checksums[nvim_architecture] }}"

# master ではなくタグで固定し、さらにチェックサムでタグの付け替えも検知する
vim_plug_version: "0.14.0"
vim_plug_url: https://raw.githubusercontent.com/junegunn/vim-plug/{{ vim_plug_version }}/plug.vim
vim_plug_checksum: sha256:20b4c895f98d13848204698068c4dd031730d4e7c9c4b630d6273b9b9afcdcdb

docker_gpg_key_url: https://download.docker.com/linux/ubuntu/gpg
docker_apt_uri: https://download.docker.com/linux/ubuntu

# VNC デスクトップ (roles/vnc)。dev.yml には含めず vnc.yml から個別に流す。
vnc_display: ":1"
# TigerVNC 1.13 以降の設定ディレクトリ。~/.vnc は旧パスで、そちらを作ると
# tigervncserver が ~/.config/tigervnc への移行を試みて失敗することがある
vnc_user_dir: "{{ ansible_facts.env.HOME }}/.config/tigervnc"
vnc_geometry: 1920x1080
# /usr/share/xsessions/<name>.desktop に対応する。xfce4-session が xfce.desktop を置く
vnc_session: xfce

vnc_desktop_packages:
  - xfce4
  # xfce4 メタパッケージは端末エミュレータを引かないので個別に入れる
  - xfce4-terminal
  - xfce4-notifyd
  # Recommends を切ると入らないが、無いとアイコンが軒並み欠ける
  - tango-icon-theme
  - dbus-x11
  # 日本語のファイル名やメニューが豆腐にならないように
  - fonts-noto-cjk

vnc_server_packages:
  - tigervnc-standalone-server
  - tigervnc-common
  # tigervncpasswd はこちらに入っている
  - tigervnc-tools
